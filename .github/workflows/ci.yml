name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
     branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: payment
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d payment"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Check PostgreSQL
        run: |
          pg_isready -h localhost -p 5432 -U postgres -d payment

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/payment
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres

      - name: Build application
        run: ./mvnw package -DskipTests

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: application
          path: target/*.jar 
    
  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Compute lowercase image name
        run: echo "IMAGE_NAME_LC=${IMAGE_NAME,,}" >> "$GITHUB_ENV"
        env:
          IMAGE_NAME: ${{ github.repository }}
      
      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: application
          path: target
      
      - name: Log in to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: Builder Docker image
        run: |
          docker build \
           -t ghcr.io/${IMAGE_NAME_LC}:${{github.sha}} \
           -t ghcr.io/${IMAGE_NAME_LC}:latest .
      
      - name: Push Docker image
        run: |
          docker push ghcr.io/${IMAGE_NAME_LC}:${{github.sha}}
          docker push ghcr.io/${IMAGE_NAME_LC}:latest